<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="manifest" href="manifest.json">
    <title>Catan Blitz Clock</title>
    <style>
        :root {
            --red: #c0392b; --blue: #2980b9; --white: #ecf0f1;
            --orange: #e67e22; --green: #27ae60; --yellow: #f1c40f; 
            --brown: #5d4037; --pink: #fd79a8;
        }
        html { touch-action: manipulation; -webkit-text-size-adjust: none; }
        body {
            background-color: #1a1a1a; color: white;
            font-family: 'Segoe UI', sans-serif; margin: 0;
            overflow: hidden; display: flex; justify-content: center;
            align-items: center; height: 100vh;
            -webkit-user-select: none; user-select: none;
        }
        #config-screen {
            display: flex; flex-direction: column; gap: 15px;
            padding: 20px; background: #2c3e50; border-radius: 15px;
            z-index: 100; width: 90vw; max-width: 800px; max-height: 90vh;
            overflow-y: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .global-settings { display: grid; grid-template-columns: 1fr; gap: 10px; }
        @media (min-width: 600px) { .global-settings { grid-template-columns: repeat(2, 1fr); } }
        .setting-item { display: flex; flex-direction: column; }
        label { font-size: 0.9rem; color: #bdc3c7; margin-bottom: 2px; }
        input, select { 
            width: 100%; padding: 12px; margin-top: 5px; 
            border-radius: 5px; border: none; font-size: 16px !important; 
            box-sizing: border-box; background: white; color: black;
        }
        .toggle-row { display: flex; align-items: center; justify-content: center; gap: 10px; background: #34495e; padding: 10px; border-radius: 10px; margin-top: 5px; }
        .section-title { text-align: center; font-weight: bold; font-size: 1.5rem; margin-top: 10px; color: white; }
        .player-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 5px; }
        .config-card { background: #34495e; padding: 10px; border-radius: 8px; text-align: center; }
        #game-screen { display: grid; width: 100vw; height: 100vh; display: none; }
        @media (orientation: landscape) { #game-screen { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; } }
        @media (orientation: portrait) { #game-screen { grid-template-columns: 1fr; grid-template-rows: repeat(4, 1fr); } }
        .player-card { display: flex; flex-direction: column; justify-content: center; align-items: center; transition: all 0.3s; position: relative; }
        .player-card.active { border: 12px solid #f1c40f; box-shadow: inset 0 0 100px rgba(0,0,0,0.5); z-index: 10; }
        .player-card:not(.active) { opacity: 0.25; }
        @keyframes pulse-red { 0% { box-shadow: inset 0 0 0px rgba(192, 57, 43, 0); } 50% { box-shadow: inset 0 0 150px rgba(192, 57, 43, 1); } 100% { box-shadow: inset 0 0 0px rgba(192, 57, 43, 0); } }
        .urgent { animation: pulse-red 1s infinite !important; border: 12px solid #c0392b !important; }
        .player-name { font-size: 4vh; font-weight: bold; text-transform: uppercase; }
        .bank-time { font-size: 16vh; font-weight: bold; line-height: 1; margin: 1vh 0; }
        .turn-time { font-size: 4vh; background: rgba(0,0,0,0.4); padding: 5px 40px; border-radius: 50px; }
        .phase-banner { position: absolute; top: 20%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.9); padding: 15px 40px; border-radius: 60px; font-size: 2rem; font-weight: bold; border: 3px solid #f1c40f; z-index: 100; pointer-events: none; }
        #robber-btn { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 20vh; height: 20vh; border-radius: 50%; background: #333; border: 6px solid #555; color: white; font-weight: bold; font-size: 3vh; cursor: pointer; z-index: 150; display: none; box-shadow: 0 0 30px rgba(0,0,0,0.8); }
        #menu-btn { position: fixed; top: 15px; right: 15px; z-index: 200; background: rgba(0,0,0,0.5); border: none; border-radius: 50%; width: 60px; height: 60px; color: white; font-size: 2rem; cursor: pointer; display: none; align-items: center; justify-content: center; }
        #modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 300; display: none; justify-content: center; align-items: center; }
        .modal-content { background: #2c3e50; padding: 30px; border-radius: 20px; text-align: center; width: 80%; max-width: 350px; }
        .modal-btn { width: 100%; padding: 18px; margin: 10px 0; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 1.1rem; }
        .btn-resume { background: #27ae60; color: white; }
        .btn-undo { background: #f39c12; color: white; }
        .btn-main { background: #c0392b; color: white; }
        #start-btn { padding: 18px; background: #27ae60; color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 1.4rem; margin-top: 15px; }
    </style>
</head>
<body>
    <button id="menu-btn" onclick="toggleMenu()">⚙</button>
    <button id="robber-btn" onclick="triggerRobber()">ROBBER</button>
    <div id="modal-overlay">
        <div class="modal-content">
            <h2>Paused</h2>
            <div id="setup-display" style="margin-bottom:15px; font-size: 0.9rem; color:#bdc3c7;"></div>
            <button class="modal-btn btn-resume" onclick="toggleMenu()">RESUME</button>
            <button class="modal-btn btn-undo" onclick="undoLastAction()">UNDO LAST TURN</button>
            <button class="modal-btn btn-main" onclick="returnToMenu()">MAIN MENU</button>
        </div>
    </div>
    <div id="config-screen">
        <h2 style="text-align: center; margin: 0;">Tournament Setup</h2>
        <div class="global-settings">
            <div class="setting-item"><label>Board Study Time (Min)</label><input type="number" id="cfg-study" value="5"></div>
            <div class="setting-item"><label>Draft Phase Time - First 3 Picks (Min)</label><input type="number" id="cfg-draft" value="2"></div>
            <div class="setting-item"><label>Draft Phase Time - Last Pick (Min)</label><input type="number" id="cfg-draft-p4" value="1.5"></div>
            <div class="setting-item">
                <label>Turn Length (Sec)</label>
                <select id="cfg-turn-len">
                    <option value="30">Bullet (30s)</option>
                    <option value="45">Fast (45s)</option>
                    <option value="60" selected>Blitz (60s)</option>
                    <option value="90">Rapid (90s)</option>
                    <option value="120">Standard (120s)</option>
                </select>
            </div>
            <div class="setting-item">
                <label>Starting Time Bank (Min)</label>
                <select id="cfg-bank-len">
                    <option value="5">Total Bank: 5 Min</option>
                    <option value="10" selected>Total Bank: 10 Min</option>
                    <option value="15">Total Bank: 15 Min</option>
                    <option value="20">Total Bank: 20 Min</option>
                </select>
            </div>
            <div class="setting-item"><label>Robber Penalty (Sec)</label><input type="number" id="cfg-robber" value="30"></div>
            <div class="setting-item">
                <label>First Player Position</label>
                <select id="cfg-first-player">
                    <option value="0">Top Left</option>
                    <option value="1">Top Right</option>
                    <option value="3">Bottom Right</option>
                    <option value="2">Bottom Left</option>
                </select>
            </div>
        </div>
        <div class="toggle-row">
            <input type="checkbox" id="cfg-click-sound" checked>
            <label for="cfg-click-sound">Enable Pass Turn "Ding"</label>
        </div>
        
        <div class="section-title">Player Location</div>
        <div class="player-grid">
            <div class="config-card"><label>Top Left</label><input type="text" id="n0" placeholder="Name"><select id="c0" onchange="handleColorChange(0)"></select></div>
            <div class="config-card"><label>Top Right</label><input type="text" id="n1" placeholder="Name"><select id="c1" onchange="handleColorChange(1)"></select></div>
            <div class="config-card"><label>Bottom Left</label><input type="text" id="n2" placeholder="Name"><select id="c2" onchange="handleColorChange(2)"></select></div>
            <div class="config-card"><label>Bottom Right</label><input type="text" id="n3" placeholder="Name"><select id="c3" onchange="handleColorChange(3)"></select></div>
        </div>
        <button id="start-btn" onclick="initGame()">START BLITZ</button>
    </div>
    <div id="phase-banner" class="phase-banner" style="display:none">STUDY PHASE</div>
    <div id="game-screen" onclick="nextTurn()">
        <div id="q0" class="player-card"><div class="player-name" id="dn0"></div><div class="bank-time" id="bt0"></div><div class="turn-time" id="tt0"></div></div>
        <div id="q1" class="player-card"><div class="player-name" id="dn1"></div><div class="bank-time" id="bt1"></div><div class="turn-time" id="tt1"></div></div>
        <div id="q2" class="player-card"><div class="player-name" id="dn2"></div><div class="bank-time" id="bt2"></div><div class="turn-time" id="tt2"></div></div>
        <div id="q3" class="player-card"><div class="player-name" id="dn3"></div><div class="bank-time" id="bt3"></div><div class="turn-time" id="tt3"></div></div>
    </div>
    <script>
        if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }
        const COLORS = [
            { name: 'White', value: 'var(--white)' },
            { name: 'Red', value: 'var(--red)' },
            { name: 'Blue', value: 'var(--blue)' },
            { name: 'Orange', value: 'var(--orange)' },
            { name: 'Green', value: 'var(--green)' },
            { name: 'Brown', value: 'var(--brown)' },
            { name: 'Pink', value: 'var(--pink)' },
            { name: 'Yellow', value: 'var(--yellow)' }
        ];
        let players = [], phase = 'STUDY', studySeconds = 0, robberSeconds = 0, robberLimit = 30, useClickSound = true, turnLimit = 60, bankLimit = 600, draftSequence = [], mainSequence = [], seqIndex = 0, timerTick = null, isPaused = false, isRobber = false, history = null, lastClickTime = 0, currentSelections = [0, 1, 2, 3];

        function setupColorMenus() { 
            for(let i=0; i<4; i++) { 
                const sel = document.getElementById(`c${i}`); 
                if (sel) { 
                    sel.innerHTML = COLORS.map((c, idx) => `<option value="${idx}">${c.name}</option>`).join(''); 
                    sel.value = currentSelections[i]; 
                } 
            } 
        }
        function handleColorChange(idx) { 
            const selEl = document.getElementById(`c${idx}`);
            if(!selEl) return;
            const newVal = parseInt(selEl.value); 
            const oldVal = currentSelections[idx]; 
            for(let i=0; i<4; i++) { 
                if(i !== idx && currentSelections[i] === newVal) { 
                    currentSelections[i] = oldVal; 
                    const otherSel = document.getElementById(`c${i}`);
                    if(otherSel) otherSel.value = oldVal; 
                } 
            } 
            currentSelections[idx] = newVal; 
        }
        const beep = (freq, vol = 0.05) => { try { const ctx = new (window.AudioContext || window.webkitAudioContext)(); const osc = ctx.createOscillator(); const gain = ctx.createGain(); osc.connect(gain); gain.connect(ctx.destination); osc.frequency.value = freq; gain.gain.value = vol; osc.start(); osc.stop(ctx.currentTime + 0.1); } catch(e) {} };
        function saveGameState() { localStorage.setItem('blitz_game_state', JSON.stringify({ players, phase, studySeconds, robberSeconds, robberLimit, useClickSound, draftSequence, mainSequence, seqIndex, isRobber, currentSelections, turnLimit, bankLimit })); }
        function loadGameState() { 
            const saved = localStorage.getItem('blitz_game_state'); 
            if (!saved) return false; 
            const s = JSON.parse(saved); 
            players = s.players; phase = s.phase; studySeconds = s.studySeconds; robberSeconds = s.robberSeconds; robberLimit = s.robberLimit; useClickSound = s.useClickSound; draftSequence = s.draftSequence; mainSequence = s.mainSequence; seqIndex = s.seqIndex; isRobber = s.isRobber; currentSelections = s.currentSelections || [0,1,2,3]; turnLimit = s.turnLimit; bankLimit = s.bankLimit; 
            setupColorMenus();
            players.forEach((p, i) => { 
                let q = document.getElementById(`q${i}`); 
                q.style.backgroundColor = p.color; 
                const cName = COLORS[currentSelections[i]]?.name || "";
                q.style.color = (p.color.includes('white') || cName === 'Yellow') ? '#1a1a1a' : 'white'; 
                document.getElementById(`dn${i}`).innerText = p.name; 
            }); 
            document.getElementById('config-screen').style.display = 'none'; document.getElementById('game-screen').style.display = 'grid'; document.getElementById('menu-btn').style.display = 'flex'; 
            if (isRobber) document.getElementById('robber-btn').innerText = "RESUME"; 
            if (phase === 'MAIN') document.getElementById('robber-btn').style.display = 'block'; 
            startTimer(); updateUI(); return true; 
        }
        async function initGame() { 
            beep(440, 0); 
            try { if ('wakeLock' in navigator) await navigator.wakeLock.request('screen'); } catch (err) {} 
            robberLimit = parseInt(document.getElementById('cfg-robber').value); 
            studySeconds = (parseFloat(document.getElementById('cfg-study').value)) * 60; 
            useClickSound = document.getElementById('cfg-click-sound').checked; 
            turnLimit = parseInt(document.getElementById('cfg-turn-len').value); 
            bankLimit = parseInt(document.getElementById('cfg-bank-len').value) * 60; 
            const startIdx = parseInt(document.getElementById('cfg-first-player').value); 
            const order = [0, 1, 3, 2]; 
            const offset = order.indexOf(startIdx); 
            mainSequence = []; 
            for(let i=0; i<4; i++) mainSequence.push(order[(offset + i) % 4]); 
            draftSequence = [...mainSequence, ...[...mainSequence].reverse()]; 
            for(let i=0; i<4; i++) { 
                const c = COLORS[currentSelections[i]]; 
                players[i] = { id: i, name: document.getElementById(`n${i}`).value || `P${i+1}`, color: c.value, bank: bankLimit, turn: turnLimit, dNorm: (parseFloat(document.getElementById('cfg-draft').value)) * 60, dP4: (parseFloat(document.getElementById('cfg-draft-p4').value)) * 60 }; 
                let q = document.getElementById(`q${i}`); 
                q.style.backgroundColor = c.value; 
                q.style.color = (c.name === 'White' || c.name === 'Yellow') ? '#1a1a1a' : 'white'; 
                document.getElementById(`dn${i}`).innerText = players[i].name; 
            } 
            document.getElementById('config-screen').style.display = 'none'; 
            document.getElementById('game-screen').style.display = 'grid'; 
            document.getElementById('menu-btn').style.display = 'flex'; 
            saveGameState(); showBanner("BOARD STUDY PHASE"); startTimer(); updateUI(); 
        }
        function nextTurn() { const now = Date.now(); if (now - lastClickTime < 500 || isPaused || isRobber) return; lastClickTime = now; history = { phase, seqIndex, studySeconds, players: JSON.parse(JSON.stringify(players)) }; if (useClickSound) beep(1200, 0.1); if (phase === 'STUDY') { phase = 'DRAFT'; seqIndex = 0; showBanner("DRAFT PHASE"); } else if (phase === 'DRAFT') { seqIndex++; if (seqIndex >= draftSequence.length) { phase = 'MAIN'; seqIndex = 0; showBanner("MAIN GAME"); document.getElementById('robber-btn').style.display = 'block'; } } else { players[mainSequence[seqIndex]].turn = turnLimit; seqIndex = (seqIndex + 1) % 4; } saveGameState(); updateUI(); }
        function undoLastAction() { if (!history) return; phase = history.phase; seqIndex = history.seqIndex; studySeconds = history.studySeconds; players = history.players; isRobber = false; document.getElementById('robber-btn').style.display = (phase === 'MAIN') ? 'block' : 'none'; toggleMenu(); updateUI(); saveGameState(); }
        function toggleMenu() { isPaused = !isPaused; document.getElementById('modal-overlay').style.display = isPaused ? 'flex' : 'none'; if (isPaused) clearInterval(timerTick); else startTimer(); }
        function triggerRobber() { if (isRobber) { isRobber = false; document.getElementById('robber-btn').innerText = "ROBBER"; } else { history = { phase, seqIndex, studySeconds, players: JSON.parse(JSON.stringify(players)) }; isRobber = true; robberSeconds = robberLimit; document.getElementById('robber-btn').innerText = "RESUME"; beep(440); } saveGameState(); }
        function startTimer() { if (timerTick) clearInterval(timerTick); timerTick = setInterval(tick, 1000); }
        function tick() { if (isRobber) { robberSeconds--; if (robberSeconds <= 0) triggerRobber(); } else if (phase === 'STUDY') { studySeconds--; if (studySeconds <= 0) nextTurn(); } else if (phase === 'DRAFT') { const p = players[draftSequence[seqIndex]]; if (seqIndex === 3 || seqIndex === 4) p.dP4--; else p.dNorm--; if (p.dNorm <= 0 && p.dP4 <= 0) nextTurn(); } else { const p = players[mainSequence[seqIndex]]; if (p.turn > 0) p.turn--; else if (p.bank > 0) p.bank--; if (p.turn <= 10 && p.turn > 0) beep(800); if (p.turn <= 0 && p.bank <= 0) nextTurn(); } saveGameState(); updateUI(); }
        function updateUI() { let activeId = (phase === 'STUDY' || isRobber) ? null : (phase === 'DRAFT' ? draftSequence[seqIndex] : mainSequence[seqIndex]); players.forEach((p, i) => { const card = document.getElementById(`q${i}`); card.classList.toggle('active', i === activeId); if (i === activeId && phase === 'MAIN' && p.turn <= 10) card.classList.add('urgent'); else card.classList.remove('urgent'); const bt = document.getElementById(`bt${i}`), tt = document.getElementById(`tt${i}`); if (isRobber) { bt.innerText = format(robberSeconds); tt.innerText = "ROBBER"; } else if (phase === 'STUDY') { bt.innerText = format(studySeconds); tt.innerText = "STUDY"; } else if (phase === 'DRAFT') { bt.innerText = format(seqIndex === 3 || seqIndex === 4 ? p.dP4 : p.dNorm); tt.innerText = "DRAFT"; } else { bt.innerText = format(p.bank); tt.innerText = format(p.turn); } }); }
        function format(s) { const m = Math.floor(Math.abs(s) / 60); const sec = Math.abs(s) % 60; return `${m}:${sec < 10 ? '0' : ''}${sec}`; }
        function showBanner(text) { const b = document.getElementById('phase-banner'); b.innerText = text; b.style.display = 'block'; if (phase === 'MAIN') setTimeout(() => b.style.display = 'none', 3000); }
        function returnToMenu() { if (confirm("Exit?")) { localStorage.removeItem('blitz_game_state'); location.reload(); } }
        
        // Final Init Sequence
        setupColorMenus(); 
        window.onload = () => { if(!loadGameState()) setupColorMenus(); };
        window.addEventListener('keydown', (e) => { if (!isPaused && ['Enter', ' ', 'ArrowUp'].includes(e.key)) { e.preventDefault(); nextTurn(); } });
    </script>
</body>
</html>
